name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust 1.88 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Test without default features
        run: cargo test --workspace --no-default-features --locked
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Install pinned dependency checker
        run: cargo +stable install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licences, bans, and sources
        run: cargo deny --workspace --locked check
      - name: Check the fuzz package
        working-directory: fuzz
        run: cargo deny --locked check

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
      - name: Install pinned fuzz runner
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Run each target for 60 seconds
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run irc_line /tmp/irc_line seeds/irc_line -- -max_total_time=60 -max_len=20000
          cargo +nightly fuzz run ctcp /tmp/ctcp seeds/ctcp -- -max_total_time=60 -max_len=70000
          cargo +nightly fuzz run dcc_message /tmp/dcc_message seeds/dcc_message -- -max_total_time=60 -max_len=2048

  research:
    name: Research specification checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -I docs/research/ack_behaviour_model.py
      - run: python -I docs/research/offer_parser_check.py
      - run: python -I docs/research/accounting_check.py
      - run: python -I docs/research/durability_model.py
