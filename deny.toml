[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"

[licenses]
confidence-threshold = 0.93
# No third-party dependencies at M0. Review additional licences when adding them.
allow = ["GPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
