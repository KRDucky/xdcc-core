[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"

[licenses]
confidence-threshold = 0.93
# Dev-dependencies are skipped unless this is set. They are not shipped, but they
# still run on developer and CI machines, so they get the same review.
include-dev = true
allow = ["Apache-2.0", "GPL-3.0-only", "MIT"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
